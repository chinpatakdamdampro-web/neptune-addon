name: Build SparkElo

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress

      # Upload the JAR as a downloadable artifact on every build.
      # Find it under Actions → your run → Artifacts.
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkElo
          path: target/SparkElo.jar
          if-no-files-found: error

      # If this build was triggered by publishing a GitHub Release,
      # attach the JAR directly to that release so it appears under Assets.
      - name: Attach JAR to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/SparkElo.jar
